[package]
name = "daemon-desktop"
version = "0.1.0"
edition = "2021"
description = "Daemon desktop app — multi-device AI agent bridge"

[lib]
name = "daemon_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-shell = "2"
# Phase 1: native shell capabilities (per OS-research synthesis)
tauri-plugin-single-instance = "2"
tauri-plugin-global-shortcut = "2"
tauri-plugin-autostart = "2"
tauri-plugin-notification = "2"
tauri-plugin-clipboard-manager = "2"
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
tokio-tungstenite = { version = "0.24", features = ["native-tls"] }
futures-util = "0.3"
sysinfo = "0.33"
hostname = "0.4"
base64 = "0.22"
chrono = "0.4"
log = "0.4"
env_logger = "0.11"
whoami = "1"
dirs = "5"
# Secure token storage — Secret Service on Linux, Keychain on macOS,
# Credential Manager on Windows. Single API across all three.
keyring = "3"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

# macOS-only deps for the menu-bar app, LaunchAgent, and TCC probes.
# Do NOT add to other targets — objc2 won't compile on Linux/Windows.
[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.5"

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]
