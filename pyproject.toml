[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "daemon-v0"
version = "0.1.0"
description = "Hardware CI/CD pipeline for the Daemon V0 multi-subsystem embedded board"
requires-python = ">=3.9"
dependencies = [
    # Phase 2 – Programmatic netlist generation
    "skidl>=1.2.0",
    # Phase 3 – SPICE transient assertions
    "PySpice>=1.5",
    "numpy>=1.26",
    # Utilities
    "rich>=13.0",          # pretty CI output
    # Daemon lifecycle
    "sdnotify>=0.3",       # systemd READY=1 + WATCHDOG=1 (pure Python, zero C deps)
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4",
    "pytest-cov>=4.1",
    "ruff>=0.4",           # linter / formatter
]

[tool.setuptools.packages.find]
where = ["."]
include = ["daemon_core*", "hal*", "netlist*", "simulation*", "layout*", "dft*"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v --tb=short"
