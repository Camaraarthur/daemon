# XcodeGen project spec for Daemon iOS app.
#
# Materialize the .xcodeproj with:
#   brew install xcodegen
#   cd ios/Daemon && xcodegen generate
#
# The generated Daemon.xcodeproj is .gitignored — this file is the
# source of truth.

name: Daemon
options:
  bundleIdPrefix: page.daemon
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  developmentLanguage: en
  groupSortPosition: top
  xcodeVersion: "15.0"

settings:
  base:
    SWIFT_VERSION: "5.9"
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    CODE_SIGN_STYLE: Automatic
    DEVELOPMENT_TEAM: ""   # Arthur: fill in with your Apple Developer Team ID
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"

targets:
  Daemon:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: Sources/Daemon
    resources:
      - path: Sources/Daemon/Resources
    info:
      path: SupportingFiles/Info.plist
      properties:
        CFBundleDisplayName: Daemon
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UILaunchScreen: {}
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        UIBackgroundModes:
          - remote-notification
          - processing
        NSSupportsLiveActivities: true
        NSCameraUsageDescription: "Daemon scans a QR code from my.daemon.page to pair this phone with your other devices."
        NSUserActivityTypes:
          - page.daemon.ChatWithDaemonIntent
          - page.daemon.ReadFileIntent
          - page.daemon.WriteFileIntent
          - page.daemon.RemindMeIntent
          - page.daemon.WhereAmIIntent
          - page.daemon.ClipboardToDaemonIntent
    entitlements:
      path: SupportingFiles/Daemon.entitlements
      properties:
        aps-environment: development
        com.apple.security.application-groups:
          - group.page.daemon.shared
        com.apple.developer.usernotifications.communication: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: page.daemon.ios
        INFOPLIST_KEY_UIApplicationSupportsIndirectInputEvents: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: "UIInterfaceOrientationPortrait UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        TARGETED_DEVICE_FAMILY: "1,2"
        SUPPORTS_MACCATALYST: NO
    dependencies:
      - target: NotificationServiceExtension

  NotificationServiceExtension:
    type: app-extension
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: Sources/NotificationServiceExtension
    info:
      path: SupportingFiles/NotificationServiceExtension-Info.plist
      properties:
        CFBundleDisplayName: DaemonNotifications
        NSExtension:
          NSExtensionPointIdentifier: com.apple.usernotifications.service
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).NotificationService
    entitlements:
      path: SupportingFiles/NotificationServiceExtension.entitlements
      properties:
        com.apple.security.application-groups:
          - group.page.daemon.shared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: page.daemon.ios.NotificationService
        SKIP_INSTALL: YES
