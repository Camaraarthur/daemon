<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="210mm" height="297mm" viewBox="0 0 210 297">
  <style>
    text { font-family: Arial, Helvetica, sans-serif; }
  </style>

  <!-- Fig. 3 label -->
  <text x="105" y="32" text-anchor="middle" font-size="6" font-weight="bold">Fig. 3</text>

  <!-- ============================================ -->
  <!-- SYSTEM BLOCK DIAGRAM -->
  <!-- ============================================ -->

  <!-- Outer device box (100) -->
  <rect x="25" y="45" width="160" height="120" rx="2" ry="2" fill="none" stroke="black" stroke-width="0.7"/>
  <text x="30" y="53" font-size="2.5">100 (Electronic Device)</text>

  <!-- Battery / Power Supply (110) -->
  <rect x="32" y="60" width="35" height="18" fill="none" stroke="black" stroke-width="0.5"/>
  <text x="49.5" y="71" text-anchor="middle" font-size="2.5">110</text>
  <text x="49.5" y="75" text-anchor="middle" font-size="1.8">Power Supply</text>

  <!-- Arrow from power to privacy interlock region -->
  <line x1="67" y1="69" x2="78" y2="69" stroke="black" stroke-width="0.5"/>
  <polygon points="78,69 75,67 75,71" fill="black" stroke="none"/>
  <text x="72" y="66" text-anchor="middle" font-size="1.5">130</text>

  <!-- Privacy Interlock Region (dashed box) -->
  <rect x="78" y="55" width="98" height="35" rx="1" ry="1" fill="none" stroke="black" stroke-width="0.5" stroke-dasharray="3,1.5"/>
  <text x="127" y="62" text-anchor="middle" font-size="2">Privacy Interlock Circuit</text>

  <!-- Indicator (140) -->
  <rect x="85" y="67" width="30" height="16" fill="none" stroke="black" stroke-width="0.5"/>
  <text x="100" y="76" text-anchor="middle" font-size="2.5">140</text>
  <text x="100" y="80" text-anchor="middle" font-size="1.5">Indicator</text>

  <!-- Arrow between indicator and sensor -->
  <line x1="115" y1="75" x2="130" y2="75" stroke="black" stroke-width="0.7"/>
  <text x="122" y="73" text-anchor="middle" font-size="1.3">Coupled</text>

  <!-- Sensor (150) -->
  <rect x="130" y="67" width="30" height="16" fill="none" stroke="black" stroke-width="0.5"/>
  <text x="145" y="76" text-anchor="middle" font-size="2.5">150</text>
  <text x="145" y="80" text-anchor="middle" font-size="1.5">Sensor</text>

  <!-- Visible to user (arrow from indicator going up/out) -->
  <line x1="100" y1="67" x2="100" y2="42" stroke="black" stroke-width="0.4"/>
  <polygon points="100,42 98,45 102,45" fill="black" stroke="none"/>
  <text x="100" y="40" text-anchor="middle" font-size="1.8">Visible to User</text>

  <!-- ============================================ -->
  <!-- PROCESSOR — NOT in power path -->
  <!-- ============================================ -->

  <rect x="32" y="105" width="45" height="18" fill="none" stroke="black" stroke-width="0.5"/>
  <text x="54.5" y="116" text-anchor="middle" font-size="2.5">160</text>
  <text x="54.5" y="120" text-anchor="middle" font-size="1.8">Processor (SoC)</text>

  <!-- Data line from sensor to processor (dashed = data, not power) -->
  <line x1="145" y1="83" x2="145" y2="98" stroke="black" stroke-width="0.4" stroke-dasharray="2,1"/>
  <line x1="145" y1="98" x2="77" y2="98" stroke="black" stroke-width="0.4" stroke-dasharray="2,1"/>
  <line x1="77" y1="98" x2="77" y2="109" stroke="black" stroke-width="0.4" stroke-dasharray="2,1"/>
  <polygon points="77,109 75,106 79,106" fill="black" stroke="none"/>
  <text x="112" y="96" text-anchor="middle" font-size="1.5">Data only (not power)</text>

  <!-- Wireless Module (170) -->
  <rect x="95" y="105" width="45" height="18" fill="none" stroke="black" stroke-width="0.5"/>
  <text x="117.5" y="116" text-anchor="middle" font-size="2.5">170</text>
  <text x="117.5" y="120" text-anchor="middle" font-size="1.8">Wireless Module</text>

  <!-- Storage (180) -->
  <rect x="32" y="130" width="45" height="15" fill="none" stroke="black" stroke-width="0.5"/>
  <text x="54.5" y="140" text-anchor="middle" font-size="2.5">180</text>
  <text x="54.5" y="144" text-anchor="middle" font-size="1.5">Storage</text>

  <!-- Battery (190) -->
  <rect x="95" y="130" width="45" height="15" fill="none" stroke="black" stroke-width="0.5"/>
  <text x="117.5" y="140" text-anchor="middle" font-size="2.5">190</text>
  <text x="117.5" y="144" text-anchor="middle" font-size="1.5">Battery</text>

  <!-- ============================================ -->
  <!-- KEY ANNOTATION: The "X" showing no connection -->
  <!-- ============================================ -->

  <!-- X mark between processor and interlock power -->
  <text x="58" y="95" text-anchor="middle" font-size="4" fill="black" font-weight="bold">X</text>
  <text x="58" y="100" text-anchor="middle" font-size="1.3">No power</text>
  <text x="58" y="103" text-anchor="middle" font-size="1.3">control path</text>

  <!-- ============================================ -->
  <!-- EXPLANATORY NOTES (bottom) -->
  <!-- ============================================ -->

  <line x1="25" y1="175" x2="185" y2="175" stroke="black" stroke-width="0.3"/>

  <text x="30" y="185" font-size="2">110 — Power supply (battery, regulator, or external source)</text>
  <text x="30" y="190" font-size="2">130 — Power supply conductor (no switching elements)</text>
  <text x="30" y="195" font-size="2">140 — Human-perceptible indicator element (LED, buzzer, etc.)</text>
  <text x="30" y="200" font-size="2">150 — Sensor element (microphone, camera, etc.)</text>
  <text x="30" y="205" font-size="2">160 — Processor / System-on-Chip (receives data from sensor)</text>
  <text x="30" y="210" font-size="2">170 — Wireless communication module</text>
  <text x="30" y="215" font-size="2">180 — Data storage</text>
  <text x="30" y="220" font-size="2">190 — Battery</text>

  <line x1="30" y1="226" x2="80" y2="226" stroke="black" stroke-width="0.5"/>
  <text x="85" y="227" font-size="1.8">= Power connection</text>
  <line x1="30" y1="231" x2="80" y2="231" stroke="black" stroke-width="0.4" stroke-dasharray="2,1"/>
  <text x="85" y="232" font-size="1.8">= Data connection (no power control)</text>

  <text x="30" y="242" font-size="2" font-weight="bold">Key property: The Processor (160) can receive data from the Sensor (150)</text>
  <text x="30" y="247" font-size="2" font-weight="bold">but has NO electrical path to control the power state of either the</text>
  <text x="30" y="252" font-size="2" font-weight="bold">Indicator (140) or the Sensor (150). No firmware, software, or electronic</text>
  <text x="30" y="257" font-size="2" font-weight="bold">control signal can deactivate the Indicator while the Sensor remains powered.</text>

</svg>
