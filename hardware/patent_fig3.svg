<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="210mm" height="297mm" viewBox="0 0 210 297">
  <style>
    text { font-family: Arial, Helvetica, sans-serif; }
    .num { font-size: 5px; font-weight: bold; }
    .fig { font-size: 8px; font-weight: bold; }
    rect, line, polygon, circle, path { fill: none; stroke: black; }
  </style>

  <!-- Fig label -->
  <text x="105" y="35" text-anchor="middle" class="fig">Fig. 3</text>

  <!-- ============================================ -->
  <!-- OUTER DEVICE BOUNDARY (100) -->
  <!-- ============================================ -->
  <rect x="30" y="60" width="150" height="170" rx="3" ry="3" stroke-width="0.8"/>
  <text x="35" y="69" class="num">100</text>

  <!-- ============================================ -->
  <!-- POWER SUPPLY (110) — top left -->
  <!-- ============================================ -->
  <rect x="42" y="80" width="32" height="20" stroke-width="0.6"/>
  <text x="58" y="93" text-anchor="middle" class="num">110</text>

  <!-- Power line going right (130) — to indicator/sensor -->
  <line x1="74" y1="90" x2="100" y2="90" stroke-width="0.8"/>
  <text x="87" y="86" text-anchor="middle" class="num">130</text>

  <!-- ============================================ -->
  <!-- INDICATOR (140) -->
  <!-- ============================================ -->
  <rect x="100" y="80" width="32" height="20" stroke-width="0.6"/>
  <text x="116" y="93" text-anchor="middle" class="num">140</text>

  <!-- Connection between indicator and sensor -->
  <line x1="132" y1="90" x2="148" y2="90" stroke-width="0.8"/>

  <!-- ============================================ -->
  <!-- SENSOR (150) -->
  <!-- ============================================ -->
  <rect x="148" y="80" width="32" height="20" stroke-width="0.6"/>
  <text x="164" y="93" text-anchor="middle" class="num">150</text>

  <!-- Visible-to-user arrow from indicator going up out of device -->
  <line x1="116" y1="80" x2="116" y2="50" stroke-width="0.5"/>
  <polygon points="116,50 113,55 119,55" fill="black" stroke="none"/>

  <!-- ============================================ -->
  <!-- PROCESSOR (160) -->
  <!-- ============================================ -->
  <rect x="42" y="130" width="32" height="20" stroke-width="0.6"/>
  <text x="58" y="143" text-anchor="middle" class="num">160</text>

  <!-- Data line from sensor to processor (DASHED — DATA, not power) -->
  <line x1="164" y1="100" x2="164" y2="115" stroke-width="0.5" stroke-dasharray="2,1"/>
  <line x1="164" y1="115" x2="58" y2="115" stroke-width="0.5" stroke-dasharray="2,1"/>
  <line x1="58" y1="115" x2="58" y2="130" stroke-width="0.5" stroke-dasharray="2,1"/>
  <polygon points="58,130 55,124 61,124" fill="black" stroke="none"/>

  <!-- BIG X marking absence of control path between processor and indicator/sensor power -->
  <line x1="92" y1="108" x2="100" y2="116" stroke-width="0.8"/>
  <line x1="100" y1="108" x2="92" y2="116" stroke-width="0.8"/>

  <!-- ============================================ -->
  <!-- WIRELESS MODULE (170) -->
  <!-- ============================================ -->
  <rect x="84" y="130" width="32" height="20" stroke-width="0.6"/>
  <text x="100" y="143" text-anchor="middle" class="num">170</text>

  <!-- ============================================ -->
  <!-- STORAGE (180) -->
  <!-- ============================================ -->
  <rect x="126" y="130" width="32" height="20" stroke-width="0.6"/>
  <text x="142" y="143" text-anchor="middle" class="num">180</text>

  <!-- ============================================ -->
  <!-- BATTERY (190) -->
  <!-- ============================================ -->
  <rect x="84" y="170" width="32" height="20" stroke-width="0.6"/>
  <text x="100" y="183" text-anchor="middle" class="num">190</text>

  <!-- Battery powers the power supply (110) -->
  <line x1="100" y1="170" x2="100" y2="120" stroke-width="0.5"/>
  <line x1="100" y1="120" x2="58" y2="120" stroke-width="0.5"/>
  <line x1="58" y1="120" x2="58" y2="100" stroke-width="0.5"/>

  <!-- Processor connects to wireless and storage (data lines, dashed) -->
  <line x1="74" y1="143" x2="84" y2="143" stroke-width="0.5" stroke-dasharray="2,1"/>
  <line x1="116" y1="143" x2="126" y2="143" stroke-width="0.5" stroke-dasharray="2,1"/>

</svg>
