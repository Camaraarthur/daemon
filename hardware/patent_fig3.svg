<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="210mm" height="297mm" viewBox="0 0 210 297">

  <!-- Fig label -->
  <text x="105" y="40" text-anchor="middle" font-family="Arial" font-size="9" font-weight="bold" fill="black">Fig. 3</text>

  <!-- ============================================ -->
  <!-- OUTER DEVICE BOUNDARY (100) -->
  <!-- ============================================ -->
  <rect x="25" y="60" width="160" height="180" rx="4" ry="4" fill="none" stroke="black" stroke-width="1"/>
  <text x="32" y="72" font-family="Arial" font-size="6" font-weight="bold" fill="black">100</text>

  <!-- ============================================ -->
  <!-- TOP ZONE: Privacy Interlock (Power → Indicator → Sensor) -->
  <!-- ============================================ -->

  <!-- Power Supply (110) -->
  <rect x="40" y="90" width="35" height="22" fill="none" stroke="black" stroke-width="0.8"/>
  <text x="57.5" y="105" text-anchor="middle" font-family="Arial" font-size="6" font-weight="bold" fill="black">110</text>

  <!-- Power line (130) — solid thick line -->
  <line x1="75" y1="101" x2="92" y2="101" stroke="black" stroke-width="1.2"/>
  <text x="83.5" y="97" text-anchor="middle" font-family="Arial" font-size="5" font-weight="bold" fill="black">130</text>

  <!-- Indicator (140) -->
  <rect x="92" y="90" width="35" height="22" fill="none" stroke="black" stroke-width="0.8"/>
  <text x="109.5" y="105" text-anchor="middle" font-family="Arial" font-size="6" font-weight="bold" fill="black">140</text>

  <!-- Coupling line between indicator and sensor (thick = power) -->
  <line x1="127" y1="101" x2="143" y2="101" stroke="black" stroke-width="1.2"/>

  <!-- Sensor (150) -->
  <rect x="143" y="90" width="35" height="22" fill="none" stroke="black" stroke-width="0.8"/>
  <text x="160.5" y="105" text-anchor="middle" font-family="Arial" font-size="6" font-weight="bold" fill="black">150</text>

  <!-- Visible-to-user arrow from indicator going UP and out of device -->
  <line x1="109.5" y1="90" x2="109.5" y2="50" stroke="black" stroke-width="0.8"/>
  <polygon points="109.5,50 106,57 113,57" fill="black" stroke="black" stroke-width="0.5"/>

  <!-- ============================================ -->
  <!-- HORIZONTAL DIVIDER (visual separation between zones) -->
  <!-- ============================================ -->
  <line x1="35" y1="135" x2="175" y2="135" stroke="black" stroke-width="0.5" stroke-dasharray="3,2"/>

  <!-- ============================================ -->
  <!-- BOTTOM ZONE: Compute (Processor, Wireless, Storage) -->
  <!-- These have NO power-control connection to the privacy zone -->
  <!-- ============================================ -->

  <!-- Processor (160) -->
  <rect x="40" y="155" width="35" height="22" fill="none" stroke="black" stroke-width="0.8"/>
  <text x="57.5" y="170" text-anchor="middle" font-family="Arial" font-size="6" font-weight="bold" fill="black">160</text>

  <!-- Wireless (170) -->
  <rect x="92" y="155" width="35" height="22" fill="none" stroke="black" stroke-width="0.8"/>
  <text x="109.5" y="170" text-anchor="middle" font-family="Arial" font-size="6" font-weight="bold" fill="black">170</text>

  <!-- Storage (180) -->
  <rect x="143" y="155" width="35" height="22" fill="none" stroke="black" stroke-width="0.8"/>
  <text x="160.5" y="170" text-anchor="middle" font-family="Arial" font-size="6" font-weight="bold" fill="black">180</text>

  <!-- Battery (190) -->
  <rect x="92" y="200" width="35" height="22" fill="none" stroke="black" stroke-width="0.8"/>
  <text x="109.5" y="215" text-anchor="middle" font-family="Arial" font-size="6" font-weight="bold" fill="black">190</text>

  <!-- ============================================ -->
  <!-- DATA LINE: Sensor → Processor (DASHED, thin) -->
  <!-- This is the ONLY connection from privacy zone to compute zone -->
  <!-- ============================================ -->
  <line x1="160.5" y1="112" x2="160.5" y2="145" stroke="black" stroke-width="0.6" stroke-dasharray="2,1.5"/>
  <line x1="160.5" y1="145" x2="57.5" y2="145" stroke="black" stroke-width="0.6" stroke-dasharray="2,1.5"/>
  <line x1="57.5" y1="145" x2="57.5" y2="155" stroke="black" stroke-width="0.6" stroke-dasharray="2,1.5"/>
  <polygon points="57.5,155 54.5,150 60.5,150" fill="black" stroke="black" stroke-width="0.3"/>

  <!-- ============================================ -->
  <!-- POWER LINE: Battery → Power Supply (solid) -->
  <!-- ============================================ -->
  <line x1="109.5" y1="200" x2="109.5" y2="190" stroke="black" stroke-width="1"/>
  <line x1="109.5" y1="190" x2="40" y2="190" stroke="black" stroke-width="1"/>
  <line x1="40" y1="190" x2="40" y2="101" stroke="black" stroke-width="1"/>
  <line x1="40" y1="101" x2="40" y2="101" stroke="black" stroke-width="1"/>

  <!-- Data lines between processor / wireless / storage (dashed) -->
  <line x1="75" y1="166" x2="92" y2="166" stroke="black" stroke-width="0.6" stroke-dasharray="2,1.5"/>
  <line x1="127" y1="166" x2="143" y2="166" stroke="black" stroke-width="0.6" stroke-dasharray="2,1.5"/>

  <!-- ============================================ -->
  <!-- LEGEND (no descriptive text — just symbol meanings) -->
  <!-- ============================================ -->
  <line x1="40" y1="255" x2="60" y2="255" stroke="black" stroke-width="1.2"/>
  <text x="63" y="257" font-family="Arial" font-size="4" fill="black">power</text>

  <line x1="90" y1="255" x2="110" y2="255" stroke="black" stroke-width="0.6" stroke-dasharray="2,1.5"/>
  <text x="113" y="257" font-family="Arial" font-size="4" fill="black">data</text>

</svg>
