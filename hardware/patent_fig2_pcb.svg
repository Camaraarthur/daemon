<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="210mm" height="297mm" viewBox="0 0 210 297">
  <style>
    text { font-family: Arial, Helvetica, sans-serif; }
  </style>

  <!-- Fig. 2 label -->
  <text x="105" y="32" text-anchor="middle" font-size="6" font-weight="bold">Fig. 2</text>

  <!-- PCB outline -->
  <rect x="35" y="45" width="140" height="100" rx="3" ry="3" fill="none" stroke="black" stroke-width="0.7"/>
  <text x="40" y="53" font-size="2">PCB</text>

  <!-- ============================================ -->
  <!-- COPPER TRACE (power supply conductor 130) -->
  <!-- Bold line showing the trace path -->
  <!-- ============================================ -->

  <!-- Power input pad (from connector) -->
  <rect x="42" y="78" width="8" height="8" fill="none" stroke="black" stroke-width="0.5"/>
  <circle cx="46" cy="82" r="2" fill="none" stroke="black" stroke-width="0.4"/>
  <text x="46" y="74" text-anchor="middle" font-size="2">110</text>
  <text x="46" y="92" text-anchor="middle" font-size="1.5">Power</text>
  <text x="46" y="95" text-anchor="middle" font-size="1.5">Input Pad</text>

  <!-- Copper trace from power to EMI filter -->
  <line x1="50" y1="82" x2="62" y2="82" stroke="black" stroke-width="1.5"/>

  <!-- EMI filter component footprint (120) -->
  <rect x="62" y="78" width="14" height="8" fill="none" stroke="black" stroke-width="0.5"/>
  <text x="69" y="84" text-anchor="middle" font-size="2">120</text>

  <!-- Copper trace from EMI to resistor -->
  <line x1="76" y1="82" x2="90" y2="82" stroke="black" stroke-width="1.5"/>
  <text x="83" y="79" text-anchor="middle" font-size="1.8">130</text>

  <!-- Resistor footprint (R) -->
  <rect x="90" y="79" width="10" height="6" fill="none" stroke="black" stroke-width="0.5"/>
  <!-- SMD pads -->
  <rect x="89" y="80" width="3" height="4" fill="black" stroke="none" opacity="0.3"/>
  <rect x="98" y="80" width="3" height="4" fill="black" stroke="none" opacity="0.3"/>
  <text x="95" y="84" text-anchor="middle" font-size="1.8">R</text>

  <!-- Copper trace from resistor to LED -->
  <line x1="100" y1="82" x2="115" y2="82" stroke="black" stroke-width="1.5"/>

  <!-- LED footprint (140) — the key component -->
  <rect x="115" y="78" width="10" height="8" fill="none" stroke="black" stroke-width="0.7"/>
  <!-- SMD pads -->
  <rect x="114" y="79.5" width="3" height="5" fill="black" stroke="none" opacity="0.3"/>
  <rect x="123" y="79.5" width="3" height="5" fill="black" stroke="none" opacity="0.3"/>
  <text x="120" y="84" text-anchor="middle" font-size="1.8">140</text>
  <text x="120" y="73" text-anchor="middle" font-size="2">(Indicator)</text>
  <!-- LED polarity mark -->
  <line x1="116" y1="79" x2="116" y2="85" stroke="black" stroke-width="0.3"/>

  <!-- Copper trace from LED to microphone -->
  <line x1="125" y1="82" x2="142" y2="82" stroke="black" stroke-width="1.5"/>

  <!-- Microphone footprint (150) -->
  <rect x="142" y="74" width="16" height="16" fill="none" stroke="black" stroke-width="0.7"/>
  <!-- Acoustic port (circle) -->
  <circle cx="150" cy="82" r="3" fill="none" stroke="black" stroke-width="0.4"/>
  <text x="150" y="83" text-anchor="middle" font-size="1.8">150</text>
  <text x="150" y="96" text-anchor="middle" font-size="2">(Sensor)</text>
  <!-- VDD pad label -->
  <text x="143" y="73" font-size="1.3">VDD</text>

  <!-- GND trace from mic -->
  <line x1="150" y1="90" x2="150" y2="105" stroke="black" stroke-width="1"/>
  <!-- GND plane indicator -->
  <line x1="140" y1="105" x2="160" y2="105" stroke="black" stroke-width="0.5"/>
  <text x="150" y="110" text-anchor="middle" font-size="1.5">GND Plane</text>

  <!-- GND from LED cathode -->
  <line x1="120" y1="86" x2="120" y2="105" stroke="black" stroke-width="1"/>
  <line x1="115" y1="105" x2="125" y2="105" stroke="black" stroke-width="0.5"/>

  <!-- Data traces from mic (thin, dashed — not power) -->
  <line x1="158" y1="82" x2="170" y2="82" stroke="black" stroke-width="0.3" stroke-dasharray="1.5,1"/>
  <text x="171" y="83" font-size="1.3">I2S Data</text>
  <line x1="158" y1="78" x2="170" y2="78" stroke="black" stroke-width="0.3" stroke-dasharray="1.5,1"/>
  <text x="171" y="79" font-size="1.3">I2S Clock</text>

  <!-- ============================================ -->
  <!-- ANNOTATIONS -->
  <!-- ============================================ -->

  <!-- Highlight the continuous power trace -->
  <text x="83" y="68" text-anchor="middle" font-size="2">Continuous power supply conductor (130)</text>
  <!-- Arrow pointing to trace -->
  <line x1="83" y1="69" x2="83" y2="80" stroke="black" stroke-width="0.3"/>
  <polygon points="83,80 81.5,77 84.5,77" fill="black" stroke="none"/>

  <!-- Cross-section detail (bottom of page) -->
  <text x="105" y="155" text-anchor="middle" font-size="3.5" font-weight="bold">2A</text>
  <text x="105" y="160" text-anchor="middle" font-size="2">(Cross-section detail — trace continuity)</text>

  <!-- PCB cross-section -->
  <!-- Substrate -->
  <rect x="40" y="175" width="130" height="10" fill="none" stroke="black" stroke-width="0.5"/>
  <text x="105" y="182" text-anchor="middle" font-size="2">PCB Substrate (FR4)</text>

  <!-- Copper trace on top -->
  <rect x="45" y="172" width="120" height="3" fill="black" stroke="black" stroke-width="0.3" opacity="0.2"/>
  <line x1="45" y1="172" x2="165" y2="172" stroke="black" stroke-width="0.7"/>
  <line x1="45" y1="175" x2="165" y2="175" stroke="black" stroke-width="0.3"/>
  <text x="105" y="170" text-anchor="middle" font-size="1.8">Copper Trace (130)</text>

  <!-- LED pads on trace -->
  <rect x="80" y="167" width="8" height="5" fill="none" stroke="black" stroke-width="0.5"/>
  <rect x="92" y="167" width="8" height="5" fill="none" stroke="black" stroke-width="0.5"/>
  <text x="90" y="165" text-anchor="middle" font-size="1.8">140 (Indicator)</text>
  <!-- Gap in trace under LED (series config) -->
  <line x1="88" y1="173" x2="92" y2="173" stroke="white" stroke-width="1.5"/>
  <text x="90" y="192" text-anchor="middle" font-size="1.5">Trace interrupted:</text>
  <text x="90" y="195" text-anchor="middle" font-size="1.5">current must flow</text>
  <text x="90" y="198" text-anchor="middle" font-size="1.5">through indicator pads</text>

  <!-- Sensor pads -->
  <rect x="130" y="167" width="10" height="5" fill="none" stroke="black" stroke-width="0.5"/>
  <text x="135" y="165" text-anchor="middle" font-size="1.8">150 (Sensor VDD)</text>

  <!-- Dimension annotation: no components between -->
  <line x1="100" y1="202" x2="130" y2="202" stroke="black" stroke-width="0.3"/>
  <line x1="100" y1="200" x2="100" y2="204" stroke="black" stroke-width="0.3"/>
  <line x1="130" y1="200" x2="130" y2="204" stroke="black" stroke-width="0.3"/>
  <text x="115" y="208" text-anchor="middle" font-size="1.5">Direct copper connection —</text>
  <text x="115" y="211" text-anchor="middle" font-size="1.5">no switching elements</text>

  <!-- Legend -->
  <text x="40" y="228" font-size="1.8">110 — Power input connection</text>
  <text x="40" y="232" font-size="1.8">120 — EMI filter component</text>
  <text x="40" y="236" font-size="1.8">130 — Power supply conductor (copper trace)</text>
  <text x="40" y="240" font-size="1.8">R — Current limiting resistor</text>
  <text x="40" y="244" font-size="1.8">140 — Indicator element (e.g. LED, surface-mount)</text>
  <text x="40" y="248" font-size="1.8">150 — Sensor element (e.g. MEMS microphone)</text>
  <line x1="40" y1="253" x2="90" y2="253" stroke="black" stroke-width="1.5"/>
  <text x="95" y="254" font-size="1.8">= Power supply conductor</text>
  <line x1="40" y1="258" x2="90" y2="258" stroke="black" stroke-width="0.3" stroke-dasharray="1.5,1"/>
  <text x="95" y="259" font-size="1.8">= Data/signal trace (not power)</text>

</svg>
