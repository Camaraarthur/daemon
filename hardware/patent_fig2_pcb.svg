<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="210mm" height="297mm" viewBox="0 0 210 297">
  <style>
    .lbl { font-family: Arial, Helvetica, sans-serif; font-size: 4px; }
    .num { font-family: Arial, Helvetica, sans-serif; font-size: 5px; font-weight: bold; }
    .small { font-family: Arial, Helvetica, sans-serif; font-size: 3px; }
    .fig { font-family: Arial, Helvetica, sans-serif; font-size: 8px; font-weight: bold; }
  </style>

  <!-- Fig label -->
  <text x="105" y="35" text-anchor="middle" class="fig">Fig. 2</text>

  <!-- ============================================ -->
  <!-- TOP VIEW (2A): Simplified PCB plan view -->
  <!-- ============================================ -->

  <!-- PCB outline with rounded corners -->
  <rect x="30" y="55" width="150" height="80" rx="4" ry="4"
        fill="white" stroke="black" stroke-width="0.6"/>

  <!-- Power input pad (110) — round pad on left -->
  <circle cx="42" cy="95" r="3.5" fill="white" stroke="black" stroke-width="0.6"/>
  <circle cx="42" cy="95" r="1" fill="black" stroke="none"/>
  <text x="42" y="86" text-anchor="middle" class="num">110</text>

  <!-- Copper trace (130) — thick line from power to first component -->
  <line x1="45.5" y1="95" x2="65" y2="95" stroke="black" stroke-width="2.5"/>

  <!-- Component 1: Resistor R footprint (two SMD pads) -->
  <rect x="65" y="92" width="3" height="6" fill="black" stroke="black" stroke-width="0.3"/>
  <rect x="73" y="92" width="3" height="6" fill="black" stroke="black" stroke-width="0.3"/>
  <rect x="68" y="93.5" width="5" height="3" fill="white" stroke="black" stroke-width="0.4"/>
  <text x="70.5" y="86" text-anchor="middle" class="lbl">R</text>

  <!-- Trace continues -->
  <line x1="76" y1="95" x2="92" y2="95" stroke="black" stroke-width="2.5"/>

  <!-- Component 2: LED indicator (140) — surface mount -->
  <rect x="92" y="91" width="3.5" height="8" fill="black" stroke="black" stroke-width="0.3"/>
  <rect x="100.5" y="91" width="3.5" height="8" fill="black" stroke="black" stroke-width="0.3"/>
  <rect x="95.5" y="92.5" width="5" height="5" fill="white" stroke="black" stroke-width="0.5"/>
  <!-- Polarity mark -->
  <line x1="96.5" y1="92.5" x2="96.5" y2="97.5" stroke="black" stroke-width="0.3"/>
  <text x="98" y="86" text-anchor="middle" class="num">140</text>

  <!-- Trace continues to sensor -->
  <line x1="104" y1="95" x2="125" y2="95" stroke="black" stroke-width="2.5"/>

  <!-- Component 3: Sensor (150) — larger square footprint -->
  <rect x="125" y="83" width="20" height="24" fill="white" stroke="black" stroke-width="0.6"/>
  <!-- Acoustic port -->
  <circle cx="135" cy="95" r="3" fill="white" stroke="black" stroke-width="0.4"/>
  <circle cx="135" cy="95" r="1.5" fill="white" stroke="black" stroke-width="0.3"/>
  <!-- Pads on sensor -->
  <rect x="123" y="86" width="3" height="2" fill="black" stroke="none"/>
  <rect x="123" y="94" width="3" height="2" fill="black" stroke="none"/>
  <rect x="123" y="102" width="3" height="2" fill="black" stroke="none"/>
  <rect x="144" y="86" width="3" height="2" fill="black" stroke="none"/>
  <rect x="144" y="94" width="3" height="2" fill="black" stroke="none"/>
  <rect x="144" y="102" width="3" height="2" fill="black" stroke="none"/>
  <text x="135" y="78" text-anchor="middle" class="num">150</text>

  <!-- GND traces (thinner) from sensor -->
  <line x1="135" y1="107" x2="135" y2="120" stroke="black" stroke-width="1"/>
  <line x1="125" y1="120" x2="145" y2="120" stroke="black" stroke-width="0.6"/>
  <line x1="128" y1="123" x2="142" y2="123" stroke="black" stroke-width="0.4"/>
  <line x1="131" y1="126" x2="139" y2="126" stroke="black" stroke-width="0.3"/>

  <!-- Data lines from sensor (dashed) -->
  <line x1="147" y1="92" x2="170" y2="92" stroke="black" stroke-width="0.4" stroke-dasharray="2,1"/>
  <line x1="147" y1="98" x2="170" y2="98" stroke="black" stroke-width="0.4" stroke-dasharray="2,1"/>

  <!-- Label 130 on the trace -->
  <text x="55" y="103" text-anchor="middle" class="num">130</text>

  <!-- View label -->
  <text x="105" y="48" text-anchor="middle" class="num">2A</text>

  <!-- ============================================ -->
  <!-- CROSS-SECTION VIEW (2B) -->
  <!-- ============================================ -->

  <text x="105" y="160" text-anchor="middle" class="num">2B</text>

  <!-- PCB substrate cross-section -->
  <rect x="30" y="180" width="150" height="14" fill="white" stroke="black" stroke-width="0.6"/>

  <!-- Hatching pattern for substrate -->
  <defs>
    <pattern id="hatch" patternUnits="userSpaceOnUse" width="3" height="3" patternTransform="rotate(45)">
      <line x1="0" y1="0" x2="0" y2="3" stroke="black" stroke-width="0.3"/>
    </pattern>
  </defs>
  <rect x="30" y="180" width="150" height="14" fill="url(#hatch)" stroke="black" stroke-width="0.6"/>

  <!-- Copper trace on top surface (thick black bar) -->
  <rect x="35" y="176" width="140" height="4" fill="black" stroke="black" stroke-width="0.3"/>

  <!-- Trace label -->
  <text x="105" y="173" text-anchor="middle" class="num">130</text>

  <!-- Power input pad on left -->
  <rect x="35" y="172" width="6" height="8" fill="black" stroke="black" stroke-width="0.3"/>
  <text x="38" y="170" text-anchor="middle" class="num">110</text>

  <!-- Resistor on top -->
  <rect x="63" y="170" width="14" height="6" fill="white" stroke="black" stroke-width="0.5"/>
  <rect x="60" y="174" width="3" height="6" fill="black"/>
  <rect x="77" y="174" width="3" height="6" fill="black"/>
  <text x="70" y="168" text-anchor="middle" class="lbl">R</text>

  <!-- LED indicator on top -->
  <rect x="92" y="170" width="14" height="6" fill="white" stroke="black" stroke-width="0.5"/>
  <rect x="89" y="174" width="3" height="6" fill="black"/>
  <rect x="106" y="174" width="3" height="6" fill="black"/>
  <text x="99" y="168" text-anchor="middle" class="num">140</text>

  <!-- Sensor on top -->
  <rect x="125" y="166" width="30" height="14" fill="white" stroke="black" stroke-width="0.5"/>
  <rect x="122" y="174" width="3" height="6" fill="black"/>
  <rect x="155" y="174" width="3" height="6" fill="black"/>
  <text x="140" y="164" text-anchor="middle" class="num">150</text>

  <!-- ============================================ -->
  <!-- DETAIL VIEW (2C): Zoom on indicator pads -->
  <!-- ============================================ -->

  <text x="105" y="215" text-anchor="middle" class="num">2C</text>

  <!-- Big zoom of LED area -->
  <rect x="60" y="225" width="90" height="50" fill="white" stroke="black" stroke-width="0.5" stroke-dasharray="2,1"/>

  <!-- Trace coming in from left (interrupted) -->
  <rect x="60" y="245" width="22" height="6" fill="black" stroke="black" stroke-width="0.3"/>
  <text x="71" y="241" text-anchor="middle" class="num">130</text>

  <!-- LED pads (gap in the trace) -->
  <rect x="85" y="240" width="6" height="16" fill="white" stroke="black" stroke-width="0.7"/>
  <rect x="98" y="240" width="6" height="16" fill="white" stroke="black" stroke-width="0.7"/>

  <!-- LED body between pads -->
  <rect x="91" y="244" width="7" height="8" fill="white" stroke="black" stroke-width="0.7"/>
  <text x="94.5" y="269" text-anchor="middle" class="num">140</text>

  <!-- Trace continuing right -->
  <rect x="107" y="245" width="22" height="6" fill="black" stroke="black" stroke-width="0.3"/>

  <!-- Sensor pad on right -->
  <rect x="129" y="240" width="6" height="16" fill="white" stroke="black" stroke-width="0.7"/>
  <text x="132" y="269" text-anchor="middle" class="num">150</text>

  <!-- Arrow showing current path through LED -->
  <line x1="83" y1="235" x2="106" y2="235" stroke="black" stroke-width="0.5"/>
  <polygon points="106,235 103,233 103,237" fill="black"/>
  <line x1="60" y1="235" x2="83" y2="235" stroke="black" stroke-width="0.5"/>

</svg>
